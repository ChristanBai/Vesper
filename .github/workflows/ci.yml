name: VigilAlpha CI

on:
  workflow_dispatch:
  push:
    paths:
      - "plugins/vesper-codex/**"
      - "scripts/build-release.sh"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "plugins/vesper-codex/**"
      - "scripts/build-release.sh"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/vesper-codex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build installable artifact
        working-directory: .
        run: ./scripts/build-release.sh
      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: vigilalpha-codex
          path: |
            dist/*.zip
            dist/*.sha256
