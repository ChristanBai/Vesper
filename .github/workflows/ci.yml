name: Vesper Codex CI

on:
  workflow_dispatch:
  push:
    paths:
      - "plugins/vesper-codex/**"
      - ".github/workflows/vesper-codex-ci.yml"
  pull_request:
    paths:
      - "plugins/vesper-codex/**"
      - ".github/workflows/vesper-codex-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/vesper-codex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
